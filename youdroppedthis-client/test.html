<!doctype html>
<html>
  <head> </head>
  <body style="background-color: aqua">
    <canvas id="canvas" style="background-color: azure"></canvas>

    <div id="mouse-pos"></div>
    <div id="transformed-mouse-pos"></div>

    <div>
      Click and drag to move the image around within the canvas. Use your mouse wheel to zoom in and
      out at the position of your mouse cursor.
    </div>
    <script>
      windowonload = () => {
        const canvas = document.getElementById('canvas')
        const context = canvas.getContext('2d')

        // See individual pixels when zooming
        context.imageSmoothingEnabled = false

        // Simply used to display the mouse position and transformed mouse position
        const mousePos = document.getElementById('mouse-pos')
        const transformedMousePos = document.getElementById('transformed-mouse-pos')

        const image = new Image()
        image.src =
          'https://roblouie.com/wp-content/uploads/2020/04/60788338_304920937106527_8424495022080625603_n.jpg'
        image.onload = drawImageToCanvas

        let isDragging = false
        let dragStartPosition = { x: 0, y: 0 }
        let currentTransformedCursor

        function drawImageToCanvas() {
          context.save()
          context.setTransform(1, 0, 0, 1, 0, 0)
          context.clearRect(0, 0, canvas.width, canvas.height)
          context.restore()

          context.drawImage(image, 0, 0, 200, 200)
        }

        function getTransformedPoint(x, y) {
          const originalPoint = new DOMPoint(x, y)
          return context.getTransform().invertSelf().transformPoint(originalPoint)
        }

        function onMouseDown(event) {
          isDragging = true
          dragStartPosition = getTransformedPoint(event.offsetX, event.offsetY)
        }

        function onMouseMove(event) {
          currentTransformedCursor = getTransformedPoint(event.offsetX, event.offsetY)
          mousePos.innerText = `Original X: ${event.offsetX}, Y: ${event.offsetY}`
          transformedMousePos.innerText = `Transformed X: ${currentTransformedCursor.x}, Y: ${currentTransformedCursor.y}`

          if (isDragging) {
            context.translate(
              currentTransformedCursor.x - dragStartPosition.x,
              currentTransformedCursor.y - dragStartPosition.y,
            )
            drawImageToCanvas()
          }
        }

        function onMouseUp() {
          isDragging = false
        }

        function onWheel(event) {
          const zoom = event.deltaY < 0 ? 1.1 : 0.9

          context.translate(currentTransformedCursor.x, currentTransformedCursor.y)
          context.scale(zoom, zoom)
          context.translate(-currentTransformedCursor.x, -currentTransformedCursor.y)

          drawImageToCanvas()
          event.preventDefault()
        }

        canvas.addEventListener('mousedown', onMouseDown)
        canvas.addEventListener('mousemove', onMouseMove)
        canvas.addEventListener('mouseup', onMouseUp)
        canvas.addEventListener('wheel', onWheel)
      }
      //============================================================================================
      window.onload = () => {
        let canvas = document.getElementById('canvas')
        let ctx = canvas.getContext('2d')
        const width = 800 || window.innerWidth
        const height = 600 || window.innerHeight

        let cameraOffset = { x: width / 2, y: height / 2 }
        let cameraZoom = 1
        let MAX_ZOOM = 5
        let MIN_ZOOM = 0.1
        let SCROLL_SENSITIVITY = 0.001

        let currentTransformedCursor

        function getTransformedPoint(x, y) {
          const originalPoint = new DOMPoint(x, y)
          const tp = ctx.getTransform().invertSelf().transformPoint(originalPoint)
          console.log(tp)
          return tp
        }

        function draw() {
          canvas.width = width
          canvas.height = height
          // Translate to the canvas centre before zooming - so you'll always zoom on what you're looking directly at
          ctx.translate(width / 2, height / 2)
          ctx.scale(cameraZoom, cameraZoom)
          ctx.translate(-width / 2 + cameraOffset.x, -height / 2 + cameraOffset.y)
          ctx.clearRect(0, 0, width, height)
          ctx.fillStyle = '#991111'
          drawRect(-50, -50, 100, 100)

          ctx.fillStyle = '#eecc77'
          drawRect(-35, -35, 20, 20)
          drawRect(15, -35, 20, 20)
          drawRect(-35, 15, 70, 20)

          requestAnimationFrame(draw)
        }

        // Gets the relevant location from a mouse or single touch event
        function getEventLocation(e) {
          if (e.touches && e.touches.length == 1) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY }
          } else if (e.clientX && e.clientY) {
            return { x: e.clientX, y: e.clientY }
          }
        }

        function drawRect(x, y, width, height) {
          ctx.fillRect(x, y, width, height)
        }

        let isDragging = false
        let dragStart = { x: 0, y: 0 }

        function onPointerDown(e) {
          isDragging = true
          dragStart.x = getEventLocation(e).x / cameraZoom - cameraOffset.x
          dragStart.y = getEventLocation(e).y / cameraZoom - cameraOffset.y
        }

        function onPointerUp(e) {
          isDragging = false
          initialPinchDistance = null
          lastZoom = cameraZoom
        }

        function onPointerMove(e) {
          currentTransformedCursor = getTransformedPoint(event.offsetX, event.offsetY)
          e.preventDefault()
          if (isDragging) {
            cameraOffset.x = getEventLocation(e).x / cameraZoom - dragStart.x
            cameraOffset.y = getEventLocation(e).y / cameraZoom - dragStart.y
          }
        }

        function handleTouch(e, singleTouchHandler) {
          if (e.touches.length == 1) {
            singleTouchHandler(e)
          } else if (e.type == 'touchmove' && e.touches.length == 2) {
            isDragging = false
            handlePinch(e)
          }
        }

        let initialPinchDistance = null
        let lastZoom = cameraZoom

        function handlePinch(e) {
          e.preventDefault()

          let touch1 = { x: e.touches[0].clientX, y: e.touches[0].clientY }
          let touch2 = { x: e.touches[1].clientX, y: e.touches[1].clientY }

          let currentDistance = (touch1.x - touch2.x) ** 2 + (touch1.y - touch2.y) ** 2

          if (initialPinchDistance == null) {
            initialPinchDistance = currentDistance
          } else {
            adjustZoom(null, currentDistance / initialPinchDistance)
          }
        }

        function adjustZoom(zoomAmount, zoomFactor) {
          if (!isDragging) {
            if (zoomAmount) {
              cameraZoom += zoomAmount
            } else if (zoomFactor) {
              cameraZoom = zoomFactor * lastZoom
            }

            cameraZoom = Math.min(cameraZoom, MAX_ZOOM)
            cameraZoom = Math.max(cameraZoom, MIN_ZOOM)
          }
        }

        canvas.addEventListener('mousedown', onPointerDown)
        canvas.addEventListener('touchstart', (e) => handleTouch(e, onPointerDown))
        canvas.addEventListener('mouseup', onPointerUp)
        canvas.addEventListener('touchend', (e) => handleTouch(e, onPointerUp))
        canvas.addEventListener('mousemove', onPointerMove)
        canvas.addEventListener('touchmove', (e) => handleTouch(e, onPointerMove))
        canvas.addEventListener('wheel', (e) => {
          e.preventDefault()
          adjustZoom(e.deltaY * SCROLL_SENSITIVITY)
        })

        // Ready, set, go
        draw()
      }
    </script>
  </body>
</html>
